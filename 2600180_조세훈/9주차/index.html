<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>9주차 css 실습</title>
    <style>
      h1 {
        color: rgb(53, 255, 13);
      }
      p {
        color: crimson;
      }
    </style>
  </head>
  <body>
    <h1>css 연습</h1>
    <p>css를 통해서 html로 만든 구조에 스타일 시트를 적용해보자.</p>
    <p>
      드디어 기본 설정이 아닌 내가 원하는 스타일로 변경해서 웹 페이지를 만들 수
      있어.
    </p>
  </body>
</html>
