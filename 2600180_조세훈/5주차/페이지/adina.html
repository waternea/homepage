      <h1>아디나</h1>
      <img src="../img/바우게.jpeg" alt="아디나" />
      <br />
      <h2>특징</h2>
      <ul>
        <li>게임 이터널리턴의 플레이어블 캐릭터다</li>
        <li>특정 스킨이 롤의 바위게를 닮아서 바위게라는 별명이 붙었다</li>
      </ul>
      <h2>장점</h2>
      <ol>
        <li>지속딜이 강하다</li>
        <li>유틸이 좋다</li>
        <li>이쁘다 - 외모도 성능</li>
      </ol>
      <h2>단점</h2>
      <ol>
        <li>이동기가 없다</li>
        <li>너무 어려워서 제대로 사용하기 힘들다</li>
        <li>
          스킬 속도도 느리고 지속딜이 높기에 적을 죽이는 템포가 느리고 돌파력도
          낮고 자기보다 사거리 긴 애들한테 맞기나 한다
        </li>
      </ol>
    </main>
