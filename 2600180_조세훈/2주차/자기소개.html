<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title id="intro">조세훈의 자기소개</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f0f0f0;
        margin: 0;
        padding: 20px;
      }

      .container {
        max-width: 600px;
        background-color: #ffffff;
        margin: 0 auto;
        padding: 20px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        border-radius: 8px;
      }

      h1 {
        color: #333;
        text-align: center;
      }

      .profile {
        display: flex;
        align-items: center;
        margin-bottom: 20px;
      }

      .profile img {
        border-radius: 50%;
        width: 100px;
        height: 100px;
        margin-right: 20px;
      }

      .profile-details {
        color: #555;
      }

      .profile-details p {
        margin: 0;
        font-size: 18px;
      }

      .intro {
        margin-top: 20px;
      }

      .intro h2 {
        font-size: 22px;
        color: #333;
      }

      .intro p {
        font-size: 16px;
        color: #666;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- 학생의 이름을 표시하는 큰 제목 -->
      <h1>조세훈의 자기소개</h1>

      <!-- 프로필 섹션 -->
      <div class="profile">
        <!-- 프로필 사진 -->
        <img src="177615295357825867.jpg" alt="조세훈의 프로필 사진" />

        <!-- 학생의 기본 정보 -->
        <div class="profile-details">
          <p><strong>이름:</strong> 조세훈</p>
          <p><strong>나이:</strong> 20세</p>
          <p><strong>취미:</strong> 게임, 노래, 노래감상</p>
        </div>
      </div>

      <!-- 간단한 자기소개 섹션 -->
      <div class="intro">
        <h2>자기소개</h2>
        <p>
          저는 조세훈이라고 합니다. 현재 20세이며, 게임과 노래를 즐기는 것을
          좋아합니다. 또한, 노래 감상도 취미 중 하나입니다. 앞으로 웹 개발
          분야에 관심을 가지고 있으며, HTML5, CSS3, JS와 같은 기술을 배우고
          싶습니다.
        </p>
        <h2>배우고 싶은 것들</h2>
        <p>HTML5, CSS3, JS</p>
        <h2>희망 취업 분야</h2>
        <p>인디 게임, 웹, 앱 개발</p>
        <h2>보유 기술</h2>
        <p>C, python</p>
      </div>
    </div>
  </body>
</html>
