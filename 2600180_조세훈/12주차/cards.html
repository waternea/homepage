<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>둥근 모서리와 그림자 통합 실습</title>
    <link rel="stylesheet" href="cards.css" />
  </head>
  <body>
    <main class="페이지">
      <header class="머리말">
        <p class="배지">CSS VISUAL CARD</p>
        <h1>졸려서자고싶다</h1>
        <p>저녘뭐먹지 오랜만에치킨먹고싶다</p>
      </header>

      <section class="카드목록" aria-label="카드 시각 효과 비교">
        <article class="카드 기본카드">
          <span class="원형배지" aria-hidden="true">A</span>
          <h2>조세훈</h2>
          <p>은 무엇으로 증명되는가</p>
        </article>

        <article class="카드 비대칭카드">
          <span class="원형배지" aria-hidden="true">B</span>
          <h2>하고싶은 것</h2>
          <p>과 할 수 있는 것이 있어야 살아있다 느낀다</p>
        </article>

        <article class="카드 안쪽카드">
          <span class="원형배지" aria-hidden="true">C</span>
          <h2>의지</h2>
          <p><code>inset</code>와 능력이 없으면 살아있지 않은걸까</p>
        </article>
      </section>
    </main>
  </body>
</html>
