  <body>
    <main class="페이지">
      <header class="소개">
        <span class="배지">BOX MODEL</span>
        <h1>세 개의 상자를 정확히 절반으로 나누기</h1>
        <p>내용·안쪽 여백·테두리·바깥 여백과 글자 속성을 함께 확인한다.</p>
      </header>

      <section class="칸목록" aria-label="박스 모델 비교">
        <article class="칸">
          <h2>첫 번째 칸</h2>
          <p class="본문">이 칸은 부모 너비의 33%를 차지한다.</p>
          <p><strong class="강조">padding</strong>은 테두리 안쪽의 여백이다.</p>
        </article>
        <article class="칸">
          <h2>두 번째 칸</h2>
          <p class="본문 긴주소">
            https://software.kunsan.ac.kr/lecture/box-model/example
          </p>
          <p>
            <span class="취소">content-box</span> 대신 border-box를 사용한다.
          </p>
        </article>
        <article class="칸">
          <h2>세 번째 칸</h2>
          <p class="본문">너무 졸리다.</p>
          <p><strong class="강조">잠</strong>이나 자야겠다.</p>
      </section>
