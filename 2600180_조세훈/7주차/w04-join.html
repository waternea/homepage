<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 32px 20px;
        font-family: system-ui, sans-serif;
        color: #172033;
        background: #dbc9ff;
      }
      main {
        width: min(100%, 680px);
        margin: auto;
        padding: 28px;
        border: 1px solid #cbd7e4;
        border-radius: 18px;
        background: #ffebeb;
        box-shadow: 0 14px 36px rgba(23, 32, 51, 0.09);
      }
      h1 {
        margin-top: 0;
        color: #173f68;
      }
      form,
      .field {
        display: grid;
        gap: 10px;
      }
      form {
        gap: 20px;
      }
      label,
      legend {
        font-weight: 700;
      }
      input,
      textarea {
        width: 100%;
        padding: 11px 12px;
        border: 1px solid #9cadbf;
        border-radius: 8px;
        font: inherit;
      }
      fieldset {
        display: grid;
        gap: 10px;
        margin: 0;
        padding: 16px;
        border: 1px solid #b9c8d7;
        border-radius: 10px;
      }
      .options {
        display: flex;
        flex-wrap: wrap;
        gap: 12px 20px;
      }
      .options label {
        display: inline-flex;
        align-items: center;
        gap: 7px;
      }
      .options input {
        width: auto;
      }
      :focus-visible {
        outline: 3px solid #2b7de9;
        outline-offset: 3px;
      }
      button {
        min-height: 46px;
        border: 0;
        border-radius: 10px;
        background: #173f68;
        color: #fff;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>동아리 가입 신청</h1>
      <form action="about:blank">
        <div class="field">
          <label for="id">아이디(필수)</label>
          <input type="text" id="id" placeholder="아이디" required />
        </div>
        <div class="field">
          <label for="name">이름(필수)</label>
          <input type="text" id="name" placeholder="이름" required />
        </div>
        <div class="field">
          <label for="password">비밀번호(필수)</label>
          <input
            type="password"
            id="password"
            placeholder="비밀번호"
            required
          />
        </div>
        <div class="field">
          <label for="email">이메일(필수)</label>
          <input type="email" id="email" placeholder="이메일" required />
        </div>
        <div class="field">
          <label for="studentId">학번(필수)</label>
          <input type="text" id="studentId" placeholder="학번" required />
        </div>

        <fieldset>
          <legend>학년</legend>
          <div class="options">
            <label for="r1"
              ><input
                type="radio"
                id="r1"
                name="학년"
                value="1"
                checked
              />1학년</label
            ><label for="r2"
              ><input type="radio" id="r2" name="학년" value="2" />2학년</label
            ><label for="r3"
              ><input type="radio" id="r3" name="학년" value="3" />3학년</label
            ><label for="r4"
              ><input type="radio" id="r4" name="학년" value="4" />4학년</label
            >
          </div>
        </fieldset>

        <fieldset>
          <legend>관심분야</legend>
          <div class="options">
            <label for="ck1"
              ><input type="checkbox" id="ck1" name="분야" value="기획" />
              기획</label
            >
            <label for="ck2"
              ><input type="checkbox" id="ck2" name="분야" value="디자인" />
              디자인</label
            >
            <label for="ck3"
              ><input type="checkbox" id="ck3" name="분야" value="개발" />
              개발</label
            >
          </div>
        </fieldset>

        <div class="field">
          <label for="date">희망 면담일(필수)</label>
          <input
            type="date"
            id="date"
            min="2026-10-13"
            max="2026-11-30"
            required
          />
        </div>

        <div class="field">
          <label for="reason">가입 동기(필수)</label>
          <textarea id="reason" placeholder="가입 동기" required></textarea>
        </div>

        <button type="submit">양식 제출</button>
      </form>
    </main>
  </body>
</html>
